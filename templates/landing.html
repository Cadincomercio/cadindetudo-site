<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <meta name="robots" content="noindex,nofollow">
  <meta property="og:image" content="{{DESKTOP_ART}}">
  <link rel="stylesheet" href="/assets/creative.css">
</head>
<body data-product="{{TRACK_PRODUCT}}" data-page="{{TRACK_PAGE}}" data-destination="{{ML_URL}}">
  <main>
    <section class="creative" aria-labelledby="product-title">
      <div class="sr-only"><h1 id="product-title">{{H1}}</h1><p>{{ART_DESCRIPTION}}</p></div>
      <picture>
        <source media="(max-width: 700px)" srcset="{{MOBILE_ART}}" width="{{MW}}" height="{{MH}}">
        <img class="art" src="{{DESKTOP_ART}}" width="{{DW}}" height="{{DH}}" alt="" fetchpriority="high">
      </picture>
      <div class="actions">
        <a class="buy" data-cadin-cta="mercado-livre" href="{{ML_URL}}" target="_blank" rel="noopener nofollow sponsored" aria-label="Comprar agora no Mercado Livre">COMPRAR AGORA <span aria-hidden="true">→</span></a>
        <a class="price" data-cadin-cta="mercado-livre" href="{{ML_URL}}" target="_blank" rel="noopener nofollow sponsored">Ver preço e entrega</a>
      </div>
    </section>
    <footer class="trust" aria-label="Informações da compra"><span>Compra pelo Mercado Livre</span><span>Preço e entrega no anúncio</span></footer>
  </main>
  <script src="/assets/tracking.js" defer></script>
</body>
</html>
